{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@700&family=La+Belle+Aurore&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %}{% endblock meta %}
</head>
<body>
    <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand handwritten">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_project' %}">Project</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p class="handwritten">&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
