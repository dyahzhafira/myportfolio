<p class="project-actions">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-project-{{ project.slug }}"
            aria-label="Hapus {{ project.title }}"
            title="Hapus proyek">
        Hapus Proyek
    </button>
</p>
<div id="delete-project-{{ project.slug }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.slug }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.slug }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.slug }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-project-title-{{ project.slug }}">Hapus Project?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ project.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.slug }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_project' project.slug %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
